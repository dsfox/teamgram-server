Name: bff.bff
ListenOn: 0.0.0.0:20010
Etcd:
  Hosts:
    - etcd:2379
  Key: bff.bff
Timeout: 0
Log:
  ServiceName: bff.bff
  #Mode: file
  #Path: ../logs/bff
  Level: debug
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20011
  Path: /metrics
#链路追踪
Telemetry:
  Name: bff.bff
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc
  
KV:
  - Host: redis:6379

# How a sign-in code is checked. Leaving Name empty selects the verifier that
# compares against the code the server actually generated, and accepts an
# invitation minted with the invite tool for a phone that has no session to send
# one to. "none" is upstream's placeholder: it accepts 12345 for any number, and
# naming it here is the one way to reopen that door.
Code:
  Name: ""
  SendCodeUrl: ""
  VerifyCodeUrl: ""
  Key: ""
  Secret: ""
  RegionId: ""

# 1-1 calls (#14): what the two phones are told to try. STUN first, always,
# because the media is meant to go device to device; the relay is the fallback
# for a symmetric NAT on both sides (seen on the first live calls) and the
# "hide my IP" setting. Both are the one coturn beside the server, as two
# entries with ids of their own. Both address families on every entry: two
# phones on carrier IPv6 connect with no NAT in the way at all.
#
# The addresses are this machine's, from the environment (CALLS_HOST, the
# public IPv4; CALLS_HOST_V6, the public IPv6 or empty), like ICE9_ADDRESS:
# the same file serves every server installed from the image, and an
# endpoint with no address is not offered at all. RelaySecret mints the
# short-lived relay credentials (TURN REST) and has to be the value coturn
# was started with; it comes from the environment too, never this file.
# Empty means no relay is offered - STUN alone goes out.
Calls:
  Servers:
    - Id: 1
      Host: ${CALLS_HOST}
      HostV6: ${CALLS_HOST_V6}
      Port: 3478
      Stun: true
      Turn: false
      Tcp: false
    - Id: 2
      Host: ${CALLS_HOST}
      HostV6: ${CALLS_HOST_V6}
      Port: 3478
      Stun: false
      Turn: true
      Tcp: false
  RelaySecret: ${CALLS_RELAY_SECRET}
  RelayTTLSeconds: 3600

BizServiceClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.biz_service
AuthSessionClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.authsession
MediaClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.media
  Timeout: 0
IdgenClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.idgen
MsgClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: messenger.msg
  Timeout: 0
DfsClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.dfs
  Timeout: 0
StatusClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.status

SyncClient:
  Topic:   "Sync-T"
  Brokers:
    - kafka:9092

# The only place where bff touches the database: device tokens for notifications
# (account.registerDevice). Details: server/pkg/pushnotify.
Mysql:
  # Statements are not logged with their values: a value can be a phone's push
  # secret, the relay's key or an invitation code, none of which belongs in a log.
  DisableStmtLog: true
  DSN: teamgram:${MYSQL_PASSWORD}@tcp(mysql:3306)/teamgram?charset=utf8mb4&parseTime=true
  Active: 8
  Idle: 8
  IdleTimeout: 4h
